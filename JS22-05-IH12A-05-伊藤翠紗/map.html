<!DOCTYPE html>
<html>
  <head>
    <title>Simple Marker</title>

    <!-- グーグルマップを読み込んでいる -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&libraries=marker"></script>
    
    <style>

        /* <gmp-map> の高さを100%にする */
      gmp-map {
        height: 100%;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

    .pin {
    font-size: 32px;
    /* ↓これはマウスを載せたときに👆のようにカーソルを変える */
    cursor: pointer;
    }


    /* gmp-advanced-markerにマウスを乗せたとき、その中にある.pinを消す */
    gmp-advanced-marker:hover .pin {
    display: none;
    }
    .marker-card {
    display: none;
    background: white;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    width: 150px;
    text-align: center;
    font-family: sans-serif;
    }

    gmp-advanced-marker:hover .marker-card {
    display: block;
    }

    .marker-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
    }

    .marker-text {
    font-size: 12px;
    color: #666;
    }
    </style>
  </head>
  <body>
    <gmp-map center="35.100331564395276, 136.59220361694318" zoom="15" map-id="DEMO_MAP_ID">


        <!-- 複数ピンを指したい場合は、<gmp-advanced-marker>を増やすだけでいい -->

        <!-- ピン１ -->
      <gmp-advanced-marker id="marker1" position="35.100331564395276, 136.59220361694318">
        <!-- ピン -->
        <div class="pin">📍</div>
        <div class="marker-card">
            <div class="marker-title">🏫 学校</div>
            <div class="marker-text">学校の場所</div>
        </div>
      </gmp-advanced-marker>
        <!-- ピン２ -->
      <gmp-advanced-marker id="marker2" position="35.09436537898649, 136.5917650125626" >

        <!-- ピン -->
        <div class="pin">📍</div>
        <div class="marker-card">
            <div class="marker-title">カフェ</div>
            <div class="marker-text">バイト先</div>
        </div>
      </gmp-advanced-marker>

    </gmp-map>
  </body>

</html>
